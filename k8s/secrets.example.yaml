# Szablon Secretu — commitowany do repo z placeholderami. Prawdziwy plik (z realnymi
# wartościami) nazywa się k8s/secrets.yaml, jest w .gitignore i aplikowany ręcznie,
# jednorazowo: `kubectl apply -f k8s/secrets.yaml`. Pipeline nigdy go nie dotyka.
apiVersion: v1
kind: Secret
metadata:
  name: lumora-api-secrets
  namespace: lumora
type: Opaque
stringData:
  ASPNETCORE_ENVIRONMENT: "Production"
  ConnectionStrings__Lumora: "Server=192.168.50.202,1433;Database=Lumora;User Id=sa;Password=CHANGEME;TrustServerCertificate=True;MultipleActiveResultSets=true"
  RoomAuth__Pepper: "CHANGEME_min_32_znaki_losowego_sekretu"
  UpdatePublish__Secret: "CHANGEME_sekret_dla_pipeline_android"
