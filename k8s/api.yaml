apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lumora-api-blobs
  namespace: lumora
spec:
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumora-api
  namespace: lumora
  labels:
    app: lumora-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lumora-api
  template:
    metadata:
      labels:
        app: lumora-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: lumora-api
          image: ghcr.io/kucha1122/lumora-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: lumora-api-secrets
          env:
            - name: BlobStore__RootPath
              value: /data/blobs
          volumeMounts:
            - name: blobs
              mountPath: /data/blobs
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: blobs
          persistentVolumeClaim:
            claimName: lumora-api-blobs
---
apiVersion: v1
kind: Service
metadata:
  name: lumora-api
  namespace: lumora
spec:
  selector:
    app: lumora-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
# Tailscale Funnel forwards the whole tailnet hostname straight into Traefik (same as
# CyclingForge) — Traefik then does the path-based routing. CyclingForge's Ingress owns "/"
# with no host, so lumora-api gets its own path prefix instead of a subdomain (Funnel exposes
# one hostname per node, not per project). The app's own routes are all rooted at "/" (no
# PathBase), so the prefix has to be stripped before Traefik forwards to the pod.
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: lumora-api-strip-prefix
  namespace: lumora
spec:
  stripPrefix:
    prefixes:
      - /lumora-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lumora-api
  namespace: lumora
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: lumora-lumora-api-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /lumora-api
            pathType: Prefix
            backend:
              service:
                name: lumora-api
                port:
                  number: 80
