name: Android

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVER_BASE_ADDRESS: https://k3s-server.tail11891a.ts.net/lumora-api
  BUILDER_IMAGE: lumora-android-builder:latest

jobs:
  build-and-publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # android-v1.2.3 -> "1.2.3"; falls back to the short SHA outside a tag push
          # (workflow_dispatch), which still lets you push an APK to test the pipeline itself.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#android-v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        shell: bash
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/lumora.keystore"

      # Everything .NET/Android/Java runs inside Docker — same reasoning as deploy.yml building
      # the server via src/Api/Dockerfile — so the bare runner host needs nothing but Docker.
      # Cached in the daemon's build cache across runs: only the first run pays for the
      # `dotnet workload install android` download (~1-2 GB).
      - name: Build Android builder image
        run: docker build -f src/Client.Android/Dockerfile.ci -t $BUILDER_IMAGE .

      - name: Publish signed APK (inside container)
        run: >
          docker run --rm
          -v "${{ github.workspace }}:/src"
          -v "$RUNNER_TEMP/lumora.keystore:/tmp/lumora.keystore:ro"
          -w /src
          $BUILDER_IMAGE
          dotnet publish src/Client.Android/Lumora.Client.Android.csproj
          -f net10.0-android -c Release
          -o /src/artifacts/android
          -p:ApplicationVersion=${{ steps.version.outputs.version_code }}
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }}
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=/tmp/lumora.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find artifacts/android -name "*-Signed.apk" | head -n1)
          if [[ -z "$APK" ]]; then
            APK=$(find artifacts/android -name "*.apk" | head -n1)
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK blob
        id: blob
        shell: bash
        run: |
          BLOB_ID=$(curl -sf -X POST "$SERVER_BASE_ADDRESS/updates/android/blobs" \
            -H "X-Update-Publish-Secret: ${{ secrets.UPDATE_PUBLISH_SECRET }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${{ steps.apk.outputs.path }}" | tr -d '"')
          echo "id=$BLOB_ID" >> "$GITHUB_OUTPUT"

      - name: Publish release metadata
        shell: bash
        run: |
          SIZE=$(stat -c%s "${{ steps.apk.outputs.path }}")
          curl -sf -X POST "$SERVER_BASE_ADDRESS/updates/android" \
            -H "X-Update-Publish-Secret: ${{ secrets.UPDATE_PUBLISH_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${{ steps.version.outputs.version }}\",\"versionCode\":${{ steps.version.outputs.version_code }},\"blobId\":\"${{ steps.blob.outputs.id }}\",\"sizeBytes\":$SIZE,\"releaseNotes\":null}"
